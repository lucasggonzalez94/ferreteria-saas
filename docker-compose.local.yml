version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: ferresaas-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ferresaas
      POSTGRES_PASSWORD: ferresaas
      POSTGRES_DB: ferresaas
    ports:
      - "5432:5432"
    volumes:
      - local_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferresaas -d ferresaas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ferresaas-local-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  local_db_data:
