services:
  postgres-test:
    image: postgres:16-alpine
    container_name: ferresaas-postgres-test
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: ferresaas_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./docker/postgres-test-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d ferresaas_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  redis-test:
    image: redis:7-alpine
    container_name: ferresaas-redis-test
    ports:
      - "127.0.0.1:56379:6379"
